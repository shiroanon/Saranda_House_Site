<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#f4f1e4" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!--
			Three text faces, one brand mark. Newsreader carries the house voice — its optical
			sizing keeps display type elegant and small headings sturdy — Manrope reads, and
			DM Mono holds dates, cities, roles and counts. Italics are requested only for
			Newsreader, the one face the site actually sets in italic. Slackey is the wordmark
			only: a single heavy weight with no italic, so the request stays small.
		-->
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Slackey&display=swap"
		/>

		<!--
			Motion gate. Reveal animations start from a hidden state, so we flag the document
			before first paint (no flash). `lib/motion.ts` sets window.__gsapBooted on load;
			if that never happens the flag is dropped again so no-JS readers still see the page.
		-->
		<script>
			(function () {
				try {
					if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
					document.documentElement.classList.add('motion');
					setTimeout(function () {
						if (!window.__gsapBooted) document.documentElement.classList.remove('motion');
					}, 2500);
				} catch (e) {
					/* matchMedia unavailable — leave the flag off and render statically */
				}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
